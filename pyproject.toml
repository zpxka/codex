[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reviewlab"
version = "0.2.0"
description = "한국어 연구자료 및 출처 검증 관리 도구"
requires-python = ">=3.11"
dependencies = ["streamlit==1.50.0", "pandas==2.3.3", "plotly==6.3.1", "matplotlib==3.10.7", "koreanize-matplotlib==0.1.1"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
include = ["reviewlab*"]

[tool.setuptools.package-data]
"reviewlab.db" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
