name: Windows cloud storage regression
on:
  workflow_dispatch:
  push:
    paths:
      - 'reviewlab/cloud/**'
      - 'tests/test_cloud_*.py'
      - '.github/workflows/windows-cloud-storage.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Windows file locks and cloud recovery (no Supabase secrets)
        run: python -m pytest tests/test_cloud_preflight.py tests/test_cloud_storage.py tests/test_cloud_ui.py -q
